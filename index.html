<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Protocolo</title>
  <meta name="description" content="Landing mobile basada en imágenes con botón hacia checkout." />
  <style>
    :root{
      --bg:#f6f1eb;
      --button:#557a2f;
      --button-text:#ffffff;
      --shadow:0 10px 30px rgba(0,0,0,.10);
      --max-mobile:480px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    body{display:flex;justify-content:center}
    .page{width:100%;max-width:var(--max-mobile);background:var(--bg)}
    .section-image{display:block;width:100%;height:auto;margin:0;padding:0}
    .checkout-wrap{padding:14px 14px 18px;background:var(--bg)}
    .checkout-link{
      display:flex;align-items:center;justify-content:center;
      width:100%;min-height:58px;padding:16px 20px;
      border-radius:999px;text-decoration:none;
      background:var(--button);color:var(--button-text);
      font-size:20px;font-weight:700;letter-spacing:.3px;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .checkout-link:active{transform:translateY(1px)}
    .spacer{height:8px;background:var(--bg)}
    @media (min-width: 481px){
      body{background:#eae2d8}
      .page{box-shadow:0 0 0 1px rgba(0,0,0,.03), 0 20px 60px rgba(0,0,0,.10)}
    }
  </style>
</head>
<body>
  <!--
    CAMBIA ESTE LINK POR TU CHECKOUT REAL.
    También puedes cambiar el texto del botón abajo.
  -->
  <div class="page">
    <img class="section-image" src="01-hero.png" alt="Hero del protocolo" />
    <img class="section-image" src="02-problema.png" alt="Problema" />
    <img class="section-image" src="03-explicacion.png" alt="Explicación" />
    <img class="section-image" src="04-protocolo.png" alt="Protocolo sencillo" />

    <div class="checkout-wrap">
      <a class="checkout-link" href="https://TU-CHECKOUT-AQUI.com" target="_blank" rel="noopener noreferrer nofollow">
        ACCEDER AL PROTOCOLO
      </a>
    </div>

    <img class="section-image" src="05-resultados-cta.png" alt="Resultados y llamada a la acción" />
  </div>
</body>
</html>
